# CI — roda em todo PR para a main e é reutilizada pelo CD antes de publicar.
# Check obrigatório no ruleset: "ci-ok" (job agregador no fim). Sem banco: não há MySQL de serviço nem migrations.

name: CI

on:
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read # nenhum job da CI escreve nada

concurrency:
  # PR: cancela a execução anterior do mesmo PR. Chamada pelo CD: run_id único, nunca cancela.
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes
        run: npm test

      - name: Testes e2e
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=critical

  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci --ignore-scripts

      - name: Testes
        run: npm test

      - name: Typecheck e build
        run: npm run build

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=critical

  workflows:
    name: workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Actions fixadas por SHA
        run: node scripts/check-action-pins.mjs

      - name: Testes das proteções de deploy
        run: |
          node --test scripts/pipeline.test.mjs
          node --test scripts/tests/deploy.test.mjs
          bash scripts/tests/pipeline.sh

      - name: actionlint
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

      - name: zizmor (auditoria de segurança dos workflows)
        env:
          GH_TOKEN: ${{ github.token }}
        run: pipx run zizmor==1.30.1 --format=github .

      - name: shellcheck dos scripts de deploy
        run: |
          shopt -s nullglob
          files=(deploy/*.sh scripts/*.sh scripts/tests/*.sh frontend/docker-entrypoint.d/*.sh)
          shellcheck "${files[@]}"

      - name: Compose de produção válido
        env:
          IMAGE_TAG: "0000000000000000000000000000000000000000"
          DOMAIN: ci.example.test
        run: |
          cd deploy
          touch .env.production
          docker compose -f compose.prod.yml config --quiet

  ci-ok:
    # Único check exigido pelo ruleset. Passa só se todos os jobs acima passaram.
    name: ci-ok
    if: always()
    needs: [api, web, workflows]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Conferir resultado de todos os jobs
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: bash scripts/check-ci-results.sh
